name: Web-Version (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "fonts/**", "build.py", "version.txt", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: python3 build.py _site && touch _site/.nojekyll && ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
